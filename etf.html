<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7fa">
<title>ETF Radar</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.back{border:0;background:#fff;border:1px solid #e0e5ea;border-radius:14px;padding:10px 14px;font-weight:700}.hero{padding:24px;border-radius:24px;background:rgba(255,255,255,.78);backdrop-filter:blur(18px);box-shadow:0 10px 35px rgba(20,30,40,.07);margin-bottom:14px}.hero h1{margin:0 0 6px;font-size:32px;letter-spacing:-1px}.hero p{margin:0;color:#687482}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.tab{border:1px solid #dde3e8;background:#fff;border-radius:14px;padding:12px;font-weight:800}.tab.active{background:#17202a;color:#fff}.list{display:grid;gap:9px}.card{background:rgba(255,255,255,.86);border:1px solid #e2e7eb;border-radius:18px;padding:15px;box-shadow:0 5px 20px rgba(20,30,40,.045)}.row{display:flex;justify-content:space-between;gap:10px}.name{font-weight:800}.ticker{color:#77828d;font-size:13px;margin-top:2px}.score{font-size:20px;font-weight:900}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.pill{background:#f0f3f5;border-radius:999px;padding:5px 9px;font-size:12px}.empty{padding:30px;text-align:center;color:#74808b}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><strong>Investment Radar</strong><button class="back" onclick="location.href='index.html'">← Stocks</button></div>
<section class="hero"><h1>ETF Radar</h1><p>Find strong, low-cost, diversified ETFs and spot unnecessary overlap.</p></section>
<div class="tabs"><button class="tab active" data-market="Canada">Canada</button><button class="tab" data-market="India">India</button></div>
<div id="list" class="list"><div class="empty">Loading ETF data…</div></div>
</div>
<script src="engine/etfRadar.js"></script>
<script>
let market='Canada';
const list=document.getElementById('list');
async function load(){
 list.innerHTML='<div class="empty">Loading…</div>';
 try{
  const r=await fetch('data/etf_'+market.toLowerCase()+'.json?'+Date.now());
  const d=await r.json();
  const rows=ETF_RADAR.rank(d.etfs||[]);
  list.innerHTML=rows.map((e,i)=>`<article class="card"><div class="row"><div><div class="name">${i+1}. ${e.name||e.ticker}</div><div class="ticker">${e.ticker} · ${e.category||'ETF'}</div></div><div class="score">${e.score}</div></div><div class="meta"><span class="pill">${e.verdict}</span><span class="pill">MER ${e.expenseRatio==null?'—':(e.expenseRatio*100).toFixed(2)+'%'}</span><span class="pill">Yield ${e.yield==null?'—':e.yield.toFixed(1)+'%'}</span><span class="pill">5Y ${e.fiveYearReturn==null?'—':e.fiveYearReturn.toFixed(1)+'%'}</span><span class="pill">Holdings ${(e.holdings||[]).length}</span></div></article>`).join('')||'<div class="empty">No ETF data available yet.</div>';
 }catch(err){list.innerHTML='<div class="empty">ETF data is still being built. Refresh after the GitHub Action completes.</div>'}
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{market=b.dataset.market;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));load()});
load();
</script>
</body>
</html>
