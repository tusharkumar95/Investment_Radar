<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7fa"><title>ETF Radar</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.back,.tab,.close{border:1px solid #e0e5ea;background:#fff;border-radius:14px;padding:10px 14px;font-weight:800;cursor:pointer}.hero,.detail{padding:24px;border-radius:24px;background:rgba(255,255,255,.82);backdrop-filter:blur(18px);box-shadow:0 10px 35px rgba(20,30,40,.07);margin-bottom:14px}.hero h1{margin:0 0 6px;font-size:32px;letter-spacing:-1px}.hero p{margin:0;color:#687482}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.tab.active{background:#17202a;color:#fff}.list{display:grid;gap:9px}.card{background:rgba(255,255,255,.88);border:1px solid #e2e7eb;border-radius:18px;padding:15px;box-shadow:0 5px 20px rgba(20,30,40,.045);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}.card:active{transform:scale(.99)}.row{display:flex;justify-content:space-between;gap:10px}.name{font-weight:800}.ticker{color:#77828d;font-size:13px;margin-top:2px}.score{font-size:20px;font-weight:900}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.pill{background:#f0f3f5;border-radius:999px;padding:5px 9px;font-size:12px}.empty{padding:30px;text-align:center;color:#74808b}.detail{display:none}.detail.show{display:block}.detail-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.detail h2{margin:4px 0;font-size:30px;letter-spacing:-.8px}.muted{color:#687482}.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.metric{background:#f5f7f9;border-radius:15px;padding:14px}.label{display:block;color:#7a8590;font-size:12px;font-weight:700;margin-bottom:5px}.value{display:block;font-size:17px;font-weight:850}.section-title{font-size:18px;font-weight:850;margin:22px 0 10px}.holdings{display:grid;gap:7px}.holding{display:grid;grid-template-columns:1fr 80px;gap:10px;align-items:center;padding:10px 12px;background:#f5f7f9;border-radius:12px}.holding span:last-child{text-align:right;font-weight:800}.bar{height:5px;background:#e2e7eb;border-radius:99px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:#17202a}.note{padding:12px 14px;border-radius:14px;background:#f5f7f9;color:#596572;line-height:1.45}.overlap{display:grid;gap:7px}.overlap-item{padding:10px 12px;border-radius:12px;background:#fff4d6}.back-link{display:inline-block;margin-bottom:10px;color:#53606d;font-weight:800;cursor:pointer}@media(max-width:700px){.wrap{padding:14px}.hero,.detail{padding:19px}.detail-grid{grid-template-columns:1fr 1fr}.detail h2{font-size:25px}}@media(max-width:430px){.detail-grid{grid-template-columns:1fr}.row{align-items:flex-start}.score{font-size:18px}}
@media(max-width:700px){html,body{overflow-x:hidden}body{padding-bottom:env(safe-area-inset-bottom)}.wrap{padding:12px max(12px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}.back,.tab,.close{min-height:44px}.hero,.detail{padding:17px}.hero h1{font-size:29px}.detail-grid{grid-template-columns:1fr 1fr}.detail-head{gap:8px}.detail-head>div{min-width:0}.detail h2{font-size:24px;overflow-wrap:anywhere}.card{padding:13px}.name{overflow-wrap:anywhere}.meta{display:flex;flex-wrap:wrap;gap:5px}.holding{grid-template-columns:minmax(0,1fr) 70px}}@media(max-width:430px){.detail-grid{grid-template-columns:1fr}.row{align-items:flex-start}.score{font-size:18px}.top strong{font-size:14px}}
@media(max-width:700px){html{-webkit-text-size-adjust:100%}.tabs{display:grid;grid-template-columns:1fr 1fr}.tab{width:100%}.detail-grid{grid-template-columns:1fr 1fr}.row>div:first-child{min-width:0}.pill{max-width:100%;overflow-wrap:anywhere}}
@media(max-width:390px){.detail-grid{grid-template-columns:1fr}.holding{grid-template-columns:minmax(0,1fr) 62px}}

@media(max-width:700px){a,button,input,select{-webkit-tap-highlight-color:transparent}button,a,.btn,.back,.nav,.tab,.market,.run,.add{touch-action:manipulation}input,select{font-size:16px!important}}

/* v1 mobile release overrides */
@media(max-width:700px){html{-webkit-text-size-adjust:100%}html,body{overflow-x:hidden}body{padding-bottom:env(safe-area-inset-bottom)}a,button,input,select{-webkit-tap-highlight-color:transparent;touch-action:manipulation}button,input,select,.back,.nav,.tab,.market,.run,.add,.btn{min-height:44px}input,select{font-size:16px!important}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><strong>Investment Radar</strong><button class="back" onclick="location.href='index.html'">← Stocks</button></div>
<section class="hero"><h1>ETF Radar</h1><p>Low-cost, diversified ETFs with performance, holdings, sector exposure and overlap analysis. Tap any ETF for the full picture.</p><div id="freshness" class="pill" style="display:inline-block;margin-top:12px;">Data status: loading…</div></section>
<div class="tabs"><button class="tab active" data-market="Canada">🇨🇦 Canada</button><button class="tab" data-market="India">🇮🇳 India</button></div><div id="compareBar" class="note" style="margin:10px 0;">Compare ETFs: select up to 2 from the list.</div><section id="comparison" class="detail"></section>
<section id="detail" class="detail"></section>
<div id="list" class="list"><div class="empty">Loading ETF data…</div></div>
</div>
<script src="engine/portfolio.js?v=1.0.0"></script><script src="engine/etfRadar.js?v=1.0.1"></script>
<script>
let market='Canada',rows=[],compare=[];
const list=document.getElementById('list'),detail=document.getElementById('detail'),comparison=document.getElementById('comparison'),compareBar=document.getElementById('compareBar');
const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(v,d=1)=>Number.isFinite(Number(v))?Number(v).toFixed(d)+'%':'—';
const num=(v,d=2)=>Number.isFinite(Number(v))?Number(v).toLocaleString('en-US',{maximumFractionDigits:d}):'—';
const money=(v)=>{if(!Number.isFinite(Number(v)))return'—';const n=Number(v);if(market==='India')return'₹'+n.toLocaleString('en-IN',{maximumFractionDigits:2});return '$'+n.toLocaleString('en-US',{maximumFractionDigits:2});};
const aum=v=>{if(!Number.isFinite(Number(v)))return'—';const n=Number(v);if(n>=1e9)return'$'+(n/1e9).toFixed(2)+'B';if(n>=1e6)return'$'+(n/1e6).toFixed(1)+'M';return'$'+num(n,0)};
function coverageMessage(coverage,label='Holdings'){const c=Number(coverage);if(!Number.isFinite(c)||c<=0)return`⚠ ${label} coverage is unavailable, so duplication cannot be fully measured.`;if(c<50)return`⚠ Only ${pct(c)} of ${label.toLowerCase()} weight is represented. Treat overlap as a lower-bound estimate.`;if(c<85)return`⚠ ${label} coverage is partial at ${pct(c)}. True duplication may be materially higher.`;return`✓ ${label} coverage is ${pct(c)}; overlap estimates have relatively strong coverage.`;}
function renderList(){list.innerHTML=rows.map((e,i)=>`<article class="card" data-ticker="${esc(e.ticker)}"><div class="row"><div><div class="name">${i+1}. ${esc(e.name||e.ticker)}</div><div class="ticker">${esc(e.ticker)} · ${esc(e.category||'ETF')}</div></div><div class="score">${e.score}</div></div><div class="meta"><span class="pill">${esc(e.verdict)}</span><span class="pill">MER ${e.expenseRatio==null?'—':pct(e.expenseRatio*100,2)}</span><span class="pill">Yield ${pct(e.yield)}</span><span class="pill">5Y ${pct(e.fiveYearReturn)}</span><span class="pill">${(e.holdings||[]).length} holdings</span><span class="pill">${(e.sectors||[]).length} sectors</span><button class="close compare-btn" data-compare="${esc(e.ticker)}" style="min-height:36px;padding:6px 10px;">${compare.includes(e.ticker)?'✓ Comparing':'＋ Compare'}</button></div></article>`).join('')||'<div class="empty">No ETF data available yet.</div>';
list.querySelectorAll('.card').forEach(c=>c.onclick=()=>openDetail(c.dataset.ticker));list.querySelectorAll('.compare-btn').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleCompare(b.dataset.compare)});}
function toggleCompare(t){if(compare.includes(t))compare=compare.filter(x=>x!==t);else{if(compare.length>=2)compare.shift();compare.push(t)}renderList();renderComparison()}
function renderComparison(){compareBar.textContent=compare.length?('Comparing: '+compare.join(' vs ')):'Compare ETFs: select up to 2 from the list.';if(compare.length!==2){comparison.classList.remove('show');comparison.innerHTML='';return}const a=rows.find(x=>x.ticker===compare[0]),b=rows.find(x=>x.ticker===compare[1]);if(!a||!b)return;const o=ETF_RADAR.overlap(a,b),so=ETF_RADAR.sectorOverlap(a,b),shared=(o.sharedDetails||[]).slice(0,12),sharedSectors=(so.shared||[]).slice(0,10),minHoldings=Math.min(o.coverageA||0,o.coverageB||0),minSectors=Math.min(so.coverageA||0,so.coverageB||0);comparison.innerHTML=`<div class="detail-head"><div><div class="muted">ETF COMPARISON</div><h2>${esc(a.ticker)} vs ${esc(b.ticker)}</h2></div><button class="close" onclick="compare=[];renderList();renderComparison()">Clear</button></div><div class="detail-grid"><div class="metric"><span class="label">Radar Fit</span><span class="value">${a.score}/100 ${esc(a.verdict)}<br>${b.score}/100 ${esc(b.verdict)}</span></div><div class="metric"><span class="label">MER</span><span class="value">${a.expenseRatio==null?'—':pct(a.expenseRatio*100,2)} vs ${b.expenseRatio==null?'—':pct(b.expenseRatio*100,2)}</span></div><div class="metric"><span class="label">5Y Return</span><span class="value">${pct(a.fiveYearReturn)} vs ${pct(b.fiveYearReturn)}</span></div><div class="metric"><span class="label">Yield</span><span class="value">${pct(a.yield)} vs ${pct(b.yield)}</span></div><div class="metric"><span class="label">Holding duplication</span><span class="value">${pct(o.percentage)}</span></div><div class="metric"><span class="label">Holdings coverage</span><span class="value">${pct(o.coverageA)} vs ${pct(o.coverageB)}</span></div><div class="metric"><span class="label">Sector duplication</span><span class="value">${so.available?pct(so.percentage):'—'}</span></div><div class="metric"><span class="label">Sector coverage</span><span class="value">${so.available?pct(so.coverageA)+' vs '+pct(so.coverageB):'Unavailable'}</span></div></div><div class="section-title">Common Holdings</div>${shared.length?`<div class="overlap">${shared.map(h=>`<div class="overlap-item"><strong>${esc(h.ticker)}</strong> · ${esc(a.ticker)} ${pct(h.weightA)} · ${esc(b.ticker)} ${pct(h.weightB)} · shared weight ${pct(h.overlapWeight)}</div>`).join('')}</div>`:'<div class="note">No common holdings detected in the available holdings data.</div>'}<div class="note" style="margin-top:8px;">${coverageMessage(minHoldings,'Holdings')}</div><div class="section-title">Sector Duplication</div>${so.available?(sharedSectors.length?`<div class="overlap">${sharedSectors.map(s=>`<div class="overlap-item"><strong>${esc(s.sector)}</strong> · ${esc(a.ticker)} ${pct(s.weightA)} · ${esc(b.ticker)} ${pct(s.weightB)} · duplicated ${pct(s.overlapWeight)}</div>`).join('')}</div>`:'<div class="note">Sector exposure is available, but no shared sectors were detected.</div>'):'<div class="note">Sector exposure is unavailable for one or both ETFs, so sector duplication cannot be calculated.</div>'}<div class="note" style="margin-top:8px;">${so.available?coverageMessage(minSectors,'Sector'):'⚠ Sector duplication is intentionally left blank rather than estimated from ETF names or categories.'}</div>`;comparison.classList.add('show');comparison.scrollIntoView({behavior:'smooth',block:'nearest'})}
function openDetail(ticker){const e=rows.find(x=>x.ticker===ticker);if(!e)return;const holdings=[...(e.holdings||[])].sort((a,b)=>(Number(b.weight)||0)-(Number(a.weight)||0));const sectors=[...(e.sectors||[])].sort((a,b)=>(Number(b.weight)||0)-(Number(a.weight)||0));const others=rows.filter(x=>x.ticker!==ticker).map(x=>({etf:x,o:ETF_RADAR.overlap(e,x),so:ETF_RADAR.sectorOverlap(e,x)})).filter(x=>x.o.percentage>0||x.so.percentage>0).sort((a,b)=>Math.max(b.o.percentage,b.so.percentage)-Math.max(a.o.percentage,a.so.percentage)).slice(0,5);const po=ETF_RADAR.portfolioOverlap(e,(window.PORTFOLIO?PORTFOLIO.load():[]),market);const holdingCoverage=holdings.reduce((s,h)=>s+(Number(h.weight)||0),0),sectorCoverage=sectors.reduce((s,h)=>s+(Number(h.weight)||0),0);detail.innerHTML=`<span class="back-link" onclick="closeDetail()">← Back to ETF list</span><div class="detail-head"><div><div class="muted">${esc(e.market)} · ${esc(e.category||'ETF')} · ${esc(e.issuer||'')}</div><h2>${esc(e.name||e.ticker)}</h2><div class="muted">${esc(e.ticker)} · ${money(e.price)}</div></div><button class="close" onclick="closeDetail()">Close</button></div><div class="detail-grid"><div class="metric"><span class="label">Radar Score</span><span class="value">${e.score}/100 · ${esc(e.verdict)}</span></div><div class="metric"><span class="label">AUM</span><span class="value">${aum(e.aum)}</span></div><div class="metric"><span class="label">MER</span><span class="value">${e.expenseRatio==null?'—':pct(e.expenseRatio*100,2)}</span></div><div class="metric"><span class="label">Yield</span><span class="value">${pct(e.yield)}</span></div><div class="metric"><span class="label">3Y Return</span><span class="value">${pct(e.threeYearReturn)}</span></div><div class="metric"><span class="label">5Y Return</span><span class="value">${pct(e.fiveYearReturn)}</span></div><div class="metric"><span class="label">Beta</span><span class="value">${num(e.beta3Y)}</span></div><div class="metric"><span class="label">Inception</span><span class="value">${esc(e.inception)}</span></div></div><div class="section-title">Underlying Holdings</div>${holdings.length?`<div class="holdings">${holdings.map(h=>`<div class="holding"><div><strong>${esc(h.ticker)}</strong><div class="bar"><i style="width:${Math.min(100,Math.max(0,Number(h.weight)||0))}%"></i></div></div><span>${pct(h.weight)}</span></div>`).join('')}</div><div class="note" style="margin-top:8px;">${coverageMessage(holdingCoverage,'Holdings')}</div>`:'<div class="note">Top holdings are not available from the current data source for this ETF.</div>'}<div class="section-title">Sector Exposure</div>${sectors.length?`<div class="holdings">${sectors.map(s=>`<div class="holding"><div><strong>${esc(s.sector)}</strong><div class="bar"><i style="width:${Math.min(100,Math.max(0,Number(s.weight)||0))}%"></i></div></div><span>${pct(s.weight)}</span></div>`).join('')}</div><div class="note" style="margin-top:8px;">${coverageMessage(sectorCoverage,'Sector')}</div>`:'<div class="note">Sector exposure is unavailable for this ETF. The app does not infer sectors from the ETF name.</div>'}<div class="section-title">Overlap with My ${esc(market)} Portfolio</div>${po.matches.length?`<div class="overlap">${po.matches.map(x=>`<div class="overlap-item"><strong>${esc(x.ticker)}</strong> is also in this ETF at about <strong>${pct(x.weight)}</strong> of the available ETF holdings.</div>`).join("")}</div><div class="note" style="margin-top:8px;">Matched ETF weight: <strong>${pct(po.weight)}</strong>. ${coverageMessage(po.coverage,'Holdings')}</div>`:`<div class="note">${holdings.length?`No ${esc(market)} stocks from your saved portfolio were found in the available ETF holdings. ${coverageMessage(po.coverage,'Holdings')}`:"Portfolio overlap cannot be calculated because holdings data is unavailable for this ETF."}</div>`}<div class="section-title">ETF-to-ETF Duplication</div>${others.length?`<div class="overlap">${others.map(x=>`<div class="overlap-item"><strong>${esc(x.etf.ticker)}</strong> · holding duplication ${pct(x.o.percentage)}${x.so.available?' · sector duplication '+pct(x.so.percentage):' · sector duplication unavailable'}. Radar score comparison favors: <strong>${esc(x.o.preferred)}</strong>.</div>`).join('')}</div>`:'<div class="note">No shared holdings or sectors were detected in the available data for the current ETF universe.</div>'}<div class="section-title">What this ETF means</div><div class="note">The detail view shows the ETF's current Radar score, cost, assets, distribution, historical performance, available underlying positions and sector exposure. Returns are historical and do not predict future performance. Holding and sector duplication use only the coverage supplied by the current data source; when coverage is partial, the app shows the result as a lower-bound estimate rather than pretending it is complete.</div>`;detail.classList.add('show');detail.scrollIntoView({behavior:'smooth',block:'start'});}
function closeDetail(){detail.classList.remove('show');detail.innerHTML='';window.scrollTo({top:0,behavior:'smooth'});}
async function load(){closeDetail();list.innerHTML='<div class="empty">Loading…</div>';try{const r=await fetch('data/etf_'+market.toLowerCase()+'.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();rows=ETF_RADAR.rank(d.etfs||[]);const f=document.getElementById('freshness'),raw=d.updatedAt||d.generated_at_utc||d.updated_at,t=raw?new Date(raw):null;if(f){if(t&&Number.isFinite(t.getTime())){const stale=(Date.now()-t.getTime())/36e5>168;f.textContent=(stale?'⚠ Stale ETF data · ':'✓ ETF data updated · ')+t.toLocaleDateString(undefined,{month:'short',day:'numeric'});}else f.textContent='ETF data loaded · update time unavailable';}renderList();}catch(err){rows=[];list.innerHTML='<div class="empty">ETF data is still being built. Refresh after the GitHub Action completes.</div>';}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{market=b.dataset.market;compare=[];renderComparison();document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));load()});load();
</script>
</body>
</html>
