<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7fa"><title>ETF Radar</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.back,.tab,.close{border:1px solid #e0e5ea;background:#fff;border-radius:14px;padding:10px 14px;font-weight:800;cursor:pointer}.hero,.detail{padding:24px;border-radius:24px;background:rgba(255,255,255,.82);backdrop-filter:blur(18px);box-shadow:0 10px 35px rgba(20,30,40,.07);margin-bottom:14px}.hero h1{margin:0 0 6px;font-size:32px;letter-spacing:-1px}.hero p{margin:0;color:#687482}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.tab.active{background:#17202a;color:#fff}.list{display:grid;gap:9px}.card{background:rgba(255,255,255,.88);border:1px solid #e2e7eb;border-radius:18px;padding:15px;box-shadow:0 5px 20px rgba(20,30,40,.045);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}.card:active{transform:scale(.99)}.row{display:flex;justify-content:space-between;gap:10px}.name{font-weight:800}.ticker{color:#77828d;font-size:13px;margin-top:2px}.score{font-size:20px;font-weight:900}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.pill{background:#f0f3f5;border-radius:999px;padding:5px 9px;font-size:12px}.empty{padding:30px;text-align:center;color:#74808b}.detail{display:none}.detail.show{display:block}.detail-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.detail h2{margin:4px 0;font-size:30px;letter-spacing:-.8px}.muted{color:#687482}.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.metric{background:#f5f7f9;border-radius:15px;padding:14px}.label{display:block;color:#7a8590;font-size:12px;font-weight:700;margin-bottom:5px}.value{display:block;font-size:17px;font-weight:850}.section-title{font-size:18px;font-weight:850;margin:22px 0 10px}.holdings{display:grid;gap:7px}.holding{display:grid;grid-template-columns:1fr 80px;gap:10px;align-items:center;padding:10px 12px;background:#f5f7f9;border-radius:12px}.holding span:last-child{text-align:right;font-weight:800}.bar{height:5px;background:#e2e7eb;border-radius:99px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:#17202a}.note{padding:12px 14px;border-radius:14px;background:#f5f7f9;color:#596572;line-height:1.45}.overlap{display:grid;gap:7px}.overlap-item{padding:10px 12px;border-radius:12px;background:#fff4d6}.back-link{display:inline-block;margin-bottom:10px;color:#53606d;font-weight:800;cursor:pointer}@media(max-width:700px){.wrap{padding:14px}.hero,.detail{padding:19px}.detail-grid{grid-template-columns:1fr 1fr}.detail h2{font-size:25px}}@media(max-width:430px){.detail-grid{grid-template-columns:1fr}.row{align-items:flex-start}.score{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><strong>Investment Radar</strong><button class="back" onclick="location.href='index.html'">← Stocks</button></div>
<section class="hero"><h1>ETF Radar</h1><p>Low-cost, diversified ETFs with performance, holdings and overlap analysis. Tap any ETF for the full picture.</p></section>
<div class="tabs"><button class="tab active" data-market="Canada">🇨🇦 Canada</button><button class="tab" data-market="India">🇮🇳 India</button></div>
<section id="detail" class="detail"></section>
<div id="list" class="list"><div class="empty">Loading ETF data…</div></div>
</div>
<script src="engine/etfRadar.js"></script>
<script>
let market='Canada',rows=[];
const list=document.getElementById('list'),detail=document.getElementById('detail');
const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(v,d=1)=>Number.isFinite(Number(v))?Number(v).toFixed(d)+'%':'—';
const num=(v,d=2)=>Number.isFinite(Number(v))?Number(v).toLocaleString('en-US',{maximumFractionDigits:d}):'—';
const money=(v)=>{if(!Number.isFinite(Number(v)))return'—';const n=Number(v);if(market==='India')return'₹'+n.toLocaleString('en-IN',{maximumFractionDigits:2});return '$'+n.toLocaleString('en-US',{maximumFractionDigits:2});};
const aum=v=>{if(!Number.isFinite(Number(v)))return'—';const n=Number(v);if(n>=1e9)return'$'+(n/1e9).toFixed(2)+'B';if(n>=1e6)return'$'+(n/1e6).toFixed(1)+'M';return'$'+num(n,0)};
function renderList(){list.innerHTML=rows.map((e,i)=>`<article class="card" data-ticker="${esc(e.ticker)}"><div class="row"><div><div class="name">${i+1}. ${esc(e.name||e.ticker)}</div><div class="ticker">${esc(e.ticker)} · ${esc(e.category||'ETF')}</div></div><div class="score">${e.score}</div></div><div class="meta"><span class="pill">${esc(e.verdict)}</span><span class="pill">MER ${e.expenseRatio==null?'—':pct(e.expenseRatio*100,2)}</span><span class="pill">Yield ${pct(e.yield)}</span><span class="pill">5Y ${pct(e.fiveYearReturn)}</span><span class="pill">${(e.holdings||[]).length} holdings</span></div></article>`).join('')||'<div class="empty">No ETF data available yet.</div>';
list.querySelectorAll('.card').forEach(c=>c.onclick=()=>openDetail(c.dataset.ticker));}
function openDetail(ticker){const e=rows.find(x=>x.ticker===ticker);if(!e)return;const holdings=[...(e.holdings||[])].sort((a,b)=>(Number(b.weight)||0)-(Number(a.weight)||0));const others=rows.filter(x=>x.ticker!==ticker).map(x=>({etf:x,o:ETF_RADAR.overlap(e,x)})).filter(x=>x.o.flagged).sort((a,b)=>b.o.percentage-a.o.percentage).slice(0,5);detail.innerHTML=`<span class="back-link" onclick="closeDetail()">← Back to ETF list</span><div class="detail-head"><div><div class="muted">${esc(e.market)} · ${esc(e.category||'ETF')} · ${esc(e.issuer||'')}</div><h2>${esc(e.name||e.ticker)}</h2><div class="muted">${esc(e.ticker)} · ${money(e.price)}</div></div><button class="close" onclick="closeDetail()">Close</button></div><div class="detail-grid"><div class="metric"><span class="label">Radar Score</span><span class="value">${e.score}/100 · ${esc(e.verdict)}</span></div><div class="metric"><span class="label">AUM</span><span class="value">${aum(e.aum)}</span></div><div class="metric"><span class="label">MER</span><span class="value">${e.expenseRatio==null?'—':pct(e.expenseRatio*100,2)}</span></div><div class="metric"><span class="label">Yield</span><span class="value">${pct(e.yield)}</span></div><div class="metric"><span class="label">3Y Return</span><span class="value">${pct(e.threeYearReturn)}</span></div><div class="metric"><span class="label">5Y Return</span><span class="value">${pct(e.fiveYearReturn)}</span></div><div class="metric"><span class="label">Beta</span><span class="value">${num(e.beta3Y)}</span></div><div class="metric"><span class="label">Inception</span><span class="value">${esc(e.inception)}</span></div></div><div class="section-title">Underlying Holdings</div>${holdings.length?`<div class="holdings">${holdings.map(h=>`<div class="holding"><div><strong>${esc(h.ticker)}</strong><div class="bar"><i style="width:${Math.min(100,Math.max(0,Number(h.weight)||0))}%"></i></div></div><span>${pct(h.weight)}</span></div>`).join('')}</div>`:'<div class="note">Top holdings are not available from the current data source for this ETF.</div>'}<div class="section-title">Overlap Watch</div>${others.length?`<div class="overlap">${others.map(x=>`<div class="overlap-item"><strong>${esc(x.etf.ticker)}</strong> shares about ${pct(x.o.percentage)} of weighted holdings with this ETF. Preferred by Radar: <strong>${esc(x.o.preferred)}</strong>.</div>`).join('')}</div>`:'<div class="note">No ≥50% weighted holding overlap detected among the current ETF universe.</div>'}<div class="section-title">What this ETF means</div><div class="note">The detail view shows the ETF's current Radar score, cost, assets, distribution, historical performance and the largest underlying positions available from the refresh. Returns are historical and do not predict future performance. Overlap is calculated from the available top-holdings weights.</div>`;detail.classList.add('show');detail.scrollIntoView({behavior:'smooth',block:'start'});}
function closeDetail(){detail.classList.remove('show');detail.innerHTML='';window.scrollTo({top:0,behavior:'smooth'});}
async function load(){closeDetail();list.innerHTML='<div class="empty">Loading…</div>';try{const r=await fetch('data/etf_'+market.toLowerCase()+'.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();rows=ETF_RADAR.rank(d.etfs||[]);renderList();}catch(err){rows=[];list.innerHTML='<div class="empty">ETF data is still being built. Refresh after the GitHub Action completes.</div>';}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{market=b.dataset.market;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));load()});load();
</script>
</body>
</html>
