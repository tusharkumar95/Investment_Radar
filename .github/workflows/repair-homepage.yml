name: Repair homepage boot

on:
  push:
    paths:
      - .github/workflows/repair-homepage.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair app boot and navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          old = '});addWatchlistControls();};'
          new = '});if(typeof window.addRadarWatchlistControls === "function")window.addRadarWatchlistControls();};'
          if old not in s:
              raise SystemExit('Expected watchlist call not found')
          s = s.replace(old, new, 1)
          nav = "\n(function ensureExtraNavigationAfterDOMReady(){function add(){const nav=document.querySelector('.app');if(!nav||document.querySelector('.radar-extra-nav'))return;const row=document.createElement('div');row.className='radar-extra-nav';row.style.cssText='display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin:-8px 0 14px;';row.innerHTML='<a href=\"smallcap.html\" style=\"display:inline-block;background:#17202a;color:#fff;border-radius:13px;padding:10px 14px;font-weight:800;text-decoration:none;\">🚀 Small Cap / Sky Rocket</a><a href=\"etf.html\" style=\"display:inline-block;background:#fff;color:#263442;border:1px solid #d8dde3;border-radius:13px;padding:10px 14px;font-weight:800;text-decoration:none;\">📊 ETF Radar</a><a href=\"portfolio.html\" style=\"display:inline-block;background:#fff;color:#263442;border:1px solid #d8dde3;border-radius:13px;padding:10px 14px;font-weight:800;text-decoration:none;\">💼 Portfolio</a>';nav.insertBefore(row,nav.firstChild);}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',add,{once:true});else add();})();\n"
          if 'ensureExtraNavigationAfterDOMReady' not in s:
              s += nav
          p.write_text(s)
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Fix homepage boot and navigation' || exit 0
          git push
