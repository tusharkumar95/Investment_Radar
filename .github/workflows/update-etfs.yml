name: Update ETF Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "15 12 * * 1-5"
  push:
    branches: [main]
    paths:
      - "scripts/build_etf_universe.py"
      - "scripts/enrich_etf_sectors.py"
      - "engine/etfRadar.js"
      - "etf.html"

permissions:
  contents: write

concurrency:
  group: investment-radar-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-etfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync with latest main before build
        run: git pull --rebase origin main

      - name: Syntax check
        run: |
          python -m py_compile scripts/build_etf_universe.py
          python -m py_compile scripts/enrich_etf_sectors.py

      - name: Build ETF universe
        run: python scripts/build_etf_universe.py

      - name: Enrich ETF sector exposure
        run: python scripts/enrich_etf_sectors.py

      - name: Validate ETF data
        run: |
          python - <<'PY'
          import json
          for market, path in [("Canada", "data/etf_canada.json"), ("India", "data/etf_india.json")]:
              d=json.load(open(path,encoding="utf-8"))
              if d.get("market") != market: raise SystemExit(f"Wrong market in {path}")
              if len(d.get("etfs", [])) < 10: raise SystemExit(f"Too few ETFs in {path}")
              with_sectors=sum(bool(e.get("sectors")) for e in d.get("etfs", []))
              if with_sectors < 1: raise SystemExit(f"No sector exposure available in {path}")
              print(f"{market}: {len(d['etfs'])} ETFs · sector exposure {with_sectors}/{len(d['etfs'])}")
          print("ETF VALIDATION PASSED")
          PY

      - name: Commit ETF data
        run: |
          git config user.name "Investment Radar"
          git config user.email "actions@github.com"
          git add data/etf_canada.json data/etf_india.json
          if git diff --cached --quiet; then
            echo "No ETF data changes."
            exit 0
          fi
          git commit -m "Update ETF Radar data"
          git pull --rebase -X theirs origin main
          git push
