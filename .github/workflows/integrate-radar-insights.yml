name: Integrate Radar Insights

on:
  push:
    paths:
      - "engine/radarInsights.js"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add insights script to index
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          tag = '    <script src="engine/radarInsights.js"></script>\n'

          if 'src="engine/radarInsights.js"' not in text:
              marker = '    <script src="detail.js"></script>\n'
              if marker not in text:
                  raise SystemExit("Expected detail.js script tag was not found.")
              text = text.replace(marker, marker + "\n" + tag, 1)
              path.write_text(text, encoding="utf-8")
              print("Radar insights script added to index.html")
          else:
              print("Radar insights script is already loaded.")
          PY

      - name: Remove temporary integration workflow
        run: rm -f .github/workflows/integrate-radar-insights.yml

      - name: Commit integration
        run: |
          git config user.name "Investment Radar"
          git config user.email "actions@github.com"
          git add index.html .github/workflows/integrate-radar-insights.yml
          git diff --cached --quiet || git commit -m "Integrate radar score insights"
          git push
