name: Update Investment Radar Moves
on:
  schedule:
    - cron: "30 12 * * 1-5"
    - cron: "30 14 * * 1-5"
    - cron: "30 21 * * 1-5"
    - cron: "30 2 * * 2-6"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_moves.py"
      - "scripts/build_moves_daily.py"
      - "scripts/refresh_moves_prices.py"
      - "scripts/fetch_canada_disclosures.py"
      - "moves-canada-verified.json"
      - "moves-canada-sedi.json"
      - "moves-tracking.json"
      - ".github/workflows/update-moves.yml"
permissions:
  contents: write
concurrency:
  group: radar-moves-update
  cancel-in-progress: true
jobs:
  update-moves:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install quote reader
        run: python -m pip install --quiet "yfinance>=0.2.50,<2"
      - name: Check Python syntax
        run: python -m py_compile scripts/fetch_moves.py scripts/build_moves_daily.py scripts/refresh_moves_prices.py scripts/fetch_canada_disclosures.py scripts/test_canada_discovery.py scripts/audit_canada_moves.py
      - name: Refresh Moves
        run: |
          python scripts/test_canada_discovery.py
          python scripts/audit_canada_moves.py
          python scripts/fetch_canada_disclosures.py
          python scripts/fetch_moves.py
          python scripts/build_moves_daily.py
          python scripts/refresh_moves_prices.py
      - name: Validate history and alerts
        run: |
          python - <<'PY'
          import json
          d=json.load(open('moves-daily.json',encoding='utf-8'))
          t=json.load(open('moves-tracking.json',encoding='utf-8'))
          h=json.load(open('moves-history.json',encoding='utf-8'))
          assert d.get('schema')==t.get('schema')==1
          assert isinstance(h.get('records'),list) and len(h['records'])>0
          assert all(a['buyers']>=2 and len(set(a['investors']))>=2 for a in d.get('alerts',[]))
          manual=[a for a in t['tracks'] if a.get('manual')]
          assert all(a.get('day') and a.get('symbol') and a.get('market') for a in manual)
          assert not set(a['id'] for a in manual)&set(a['id'] for a in d.get('alerts',[]))
          assert isinstance(t.get('quotes'),dict)
          assert any(a['symbol']=='DPWIRES' and a['day']=='2026-10-06' for a in manual)
          print('Moves ready:',len(d['days']),'dates,',len(t['tracks']),'tracked stocks')
          PY
      - name: Publish data safely with retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "radar-moves-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publish() {
            git add moves.json moves-history.json moves-intelligence.json moves-daily.json moves-tracking.json moves-canada-discovery-test.json moves-canada-candidates.json moves-canada-audit.json moves-canada-auto.json
            git diff --cached --quiet && return 0
            git commit -m "Update Investment Radar Moves"
            git push origin HEAD:main
          }
          if publish; then exit 0; fi
          git fetch origin main
          git reset --hard origin/main
          python scripts/test_canada_discovery.py
          python scripts/audit_canada_moves.py
          python scripts/fetch_canada_disclosures.py
          python scripts/fetch_moves.py
          python scripts/build_moves_daily.py
          python scripts/refresh_moves_prices.py
          publish
