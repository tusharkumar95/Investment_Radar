name: Update Investment Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * 1-5"

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download latest Investment Universe
        run: |
          mkdir -p data
          curl -L --fail --retry 3 https://raw.githubusercontent.com/tusharkumar95/Investment_Universe/main/data/canada_universe.json -o data/canada.json
          curl -L --fail --retry 3 https://raw.githubusercontent.com/tusharkumar95/Investment_Universe/main/data/india_universe.json -o data/india.json

      - name: Validate universe input
        run: |
          python - <<'PY'
          import json

          checks = [
              ("Canada", "data/canada.json", "Canada"),
              ("India", "data/india.json", "India"),
          ]

          for market, path, expected_market in checks:
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)

              stocks = data.get("stocks", [])
              print(f"{path}: {len(stocks)} universe stocks")
              print(f"  source: {data.get('source')}")
              print(f"  generated_at_utc: {data.get('generated_at_utc')}")

              if data.get("market") != expected_market:
                  raise SystemExit(f"{path} has unexpected market: {data.get('market')}")
              if "Investment Universe" not in str(data.get("source", "")) and "Yahoo Finance screener" not in str(data.get("source", "")):
                  raise SystemExit(f"{path} does not appear to be an Investment Universe output")
              if len(stocks) != 150:
                  raise SystemExit(f"{path} contains {len(stocks)} stocks; expected 150")

              symbols = []
              for stock in stocks:
                  symbol = stock.get("symbol")
                  if not symbol:
                      raise SystemExit(f"{path} contains a stock without a symbol")
                  if stock.get("quoteType") not in (None, "EQUITY"):
                      raise SystemExit(f"{path} contains non-equity security: {symbol}")
                  symbols.append(symbol)

              if len(symbols) != len(set(symbols)):
                  raise SystemExit(f"{path} contains duplicate symbols")

          print("INVESTMENT UNIVERSE INPUT VALIDATION PASSED")
          PY

      - name: Patch known updater syntax issue
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/update_market_data.py")
          text = path.read_text(encoding="utf-8")

          broken = '''        print("")
        print(
            f"Price batch "
            f"{start + 1}-"
            f"{min("
                start + BATCH_SIZE,
                len(tickers)
            )}"
        )'''

          fixed = '''        end = min(start + BATCH_SIZE, len(tickers))
        print("")
        print(f"Price batch {start + 1}-{end}")'''

          if broken in text:
              text = text.replace(broken, fixed, 1)
              path.write_text(text, encoding="utf-8")
              print("Patched known Price batch f-string syntax issue.")
          elif 'print(f"Price batch {start + 1}-{end}")' in text:
              print("Price batch syntax is already fixed.")
          else:
              raise SystemExit("Expected Price batch block was not found; refusing to continue.")
          PY

      - name: Syntax check updater
        run: python -m py_compile scripts/update_market_data.py

      - name: Update market data
        run: python scripts/update_market_data.py

      - name: Verify generated data
        run: |
          python - <<'PY'
          import json
          for file in ["data/canada.json", "data/india.json"]:
              with open(file, encoding="utf-8") as f:
                  data = json.load(f)
              stocks = data.get("stocks", [])
              print(f"{file}: {len(stocks)} stocks")
              if len(stocks) < 100:
                  raise SystemExit(f"{file} contains too few stocks")
              price_count = sum(1 for s in stocks if isinstance(s.get("price"), dict) and s["price"].get("current") is not None)
              fundamentals_count = sum(1 for s in stocks if isinstance(s.get("fundamentals"), dict))
              valuation_count = sum(1 for s in stocks if isinstance(s.get("valuation"), dict))
              technical_count = sum(1 for s in stocks if isinstance(s.get("technical"), dict))
              print(f"  Price data: {price_count}")
              print(f"  Fundamentals: {fundamentals_count}")
              print(f"  Valuation: {valuation_count}")
              print(f"  Technical: {technical_count}")
              if price_count == 0: raise SystemExit(f"{file} contains NO actual price data")
              if fundamentals_count == 0: raise SystemExit(f"{file} contains NO fundamentals data")
              if valuation_count == 0: raise SystemExit(f"{file} contains NO valuation data")
              if technical_count == 0: raise SystemExit(f"{file} contains NO technical data")
          print("DATA VALIDATION PASSED")
          PY

      - name: Commit updated data
        run: |
          git config user.name "Investment Radar"
          git config user.email "actions@github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "Update investment data"
          git push
