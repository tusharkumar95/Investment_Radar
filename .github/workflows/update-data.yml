name: Update Investment Data

on:
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build investment universe
        run: |
          python scripts/build_universe.py

      - name: Update market data
        run: |
          python scripts/update_market_data.py

      - name: Verify generated data
        run: |
          python - <<'PY'
          import json

          for file in [
              "data/canada.json",
              "data/india.json"
          ]:
              with open(file) as f:
                  data = json.load(f)

              stocks = data.get("stocks", [])

              print(f"{file}: {len(stocks)} stocks")

              if len(stocks) < 50:
                  raise SystemExit(
                      f"{file} contains too few stocks"
                  )

              price_count = sum(
                  1 for s in stocks
                  if isinstance(s.get("price"), dict)
                  and s["price"].get("current") is not None
              )

              fundamentals_count = sum(
                  1 for s in stocks
                  if isinstance(s.get("fundamentals"), dict)
              )

              valuation_count = sum(
                  1 for s in stocks
                  if isinstance(s.get("valuation"), dict)
              )

              technical_count = sum(
                  1 for s in stocks
                  if isinstance(s.get("technical"), dict)
              )

              print(f"  Price data: {price_count}")
              print(f"  Fundamentals: {fundamentals_count}")
              print(f"  Valuation: {valuation_count}")
              print(f"  Technical: {technical_count}")

              if price_count == 0:
                  raise SystemExit(
                      f"{file} contains NO actual price data"
                  )

              if fundamentals_count == 0:
                  raise SystemExit(
                      f"{file} contains NO fundamentals data"
                  )

              if valuation_count == 0:
                  raise SystemExit(
                      f"{file} contains NO valuation data"
                  )

              if technical_count == 0:
                  raise SystemExit(
                      f"{file} contains NO technical data"
                  )

          print("DATA VALIDATION PASSED")
          PY

      - name: Commit updated data
        run: |
          git config user.name "Investment Radar"
          git config user.email "actions@github.com"

          git add data/*.json

          git diff --cached --quiet || git commit -m "Update investment data"

          git push
