name: Update Investment Data

# Production rebuild: refresh upstream universe, market/fundamental data,
# technical history, and the lightweight Radar payloads.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-data.yml"
      - "scripts/enrich_technical.py"
      - "scripts/update_market_data.py"
  schedule:
    - cron: "30 11 * * 1-5"

# Every workflow that writes generated data to main uses this same queue.
# This prevents ETF, Small Cap, Custom, and main-data jobs from racing to push.
concurrency:
  group: investment-radar-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download latest Investment Universe
        run: |
          mkdir -p data
          curl -L --fail --retry 3 https://raw.githubusercontent.com/tusharkumar95/Investment_Universe/main/data/canada_universe.json -o data/canada.json
          curl -L --fail --retry 3 https://raw.githubusercontent.com/tusharkumar95/Investment_Universe/main/data/india_universe.json -o data/india.json

      - name: Validate Investment Universe
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          checks=[('Canada',Path('data/canada.json')),('India',Path('data/india.json'))]
          for market,path in checks:
              data=json.loads(path.read_text(encoding='utf-8'))
              stocks=data.get('stocks',[])
              if data.get('market') != market:
                  raise SystemExit(f'{path} has unexpected market: {data.get("market")}')
              if len(stocks) < 100:
                  raise SystemExit(f'{path} contains fewer than 100 stocks')
              missing=[s.get('symbol') or s.get('ticker') for s in stocks if not s.get('industry')]
              if missing:
                  raise SystemExit(f'{path} contains stocks with missing industry: {missing[:10]}')
              counts={}
              for s in stocks:
                  industry=s.get('industry','Unknown')
                  counts[industry]=counts.get(industry,0)+1
              offenders={k:v for k,v in counts.items() if v>10}
              if offenders:
                  raise SystemExit(f'{path} violates max 10 stocks per industry: {offenders}')
              print(f'{market}: {len(stocks)} stocks; {len(counts)} industries; max industry count {max(counts.values())}')
          print('INVESTMENT UNIVERSE VALIDATION PASSED')
          PY

      - name: Syntax check data engines
        run: |
          python -m py_compile scripts/update_market_data.py
          python -m py_compile scripts/enrich_technical.py

      - name: Update market data
        run: python scripts/update_market_data.py

      - name: Enrich technical history and indicators
        run: python scripts/enrich_technical.py

      - name: Verify generated data
        run: |
          python - <<'PY'
          import json
          for path in ('data/canada.json','data/india.json'):
              data=json.load(open(path,encoding='utf-8'))
              stocks=data.get('stocks',[])
              if len(stocks) < 100:
                  raise SystemExit(f'{path} contains too few stocks')
              if not any(isinstance(s.get('price'),dict) and s['price'].get('current') is not None for s in stocks):
                  raise SystemExit(f'{path} contains NO actual price data')
              if not any(isinstance(s.get('fundamentals'),dict) for s in stocks):
                  raise SystemExit(f'{path} contains NO fundamentals data')
              if not any(isinstance(s.get('valuation'),dict) for s in stocks):
                  raise SystemExit(f'{path} contains NO valuation data')
              if not any(isinstance(s.get('technical'),dict) and len(s['technical'].get('history',[]))>=100 for s in stocks):
                  raise SystemExit(f'{path} contains NO technical history')
              print(f'{path}: {len(stocks)} stocks - validation passed')
          print('DATA VALIDATION PASSED')
          PY

      - name: Report coverage
        run: |
          python - <<'PY'
          import json
          for market, path in [("Canada", "data/canada.json"), ("India", "data/india.json")]:
              data=json.load(open(path,encoding="utf-8")); stocks=data.get("stocks",[]); total=len(stocks)
              checks={
                  "ROIC":sum(s.get("fundamentals",{}).get("roic") is not None for s in stocks),
                  "ROE":sum(s.get("fundamentals",{}).get("roe") is not None for s in stocks),
                  "FCF":sum(s.get("fundamentals",{}).get("freeCashFlow") is not None for s in stocks),
                  "PEG":sum(s.get("valuation",{}).get("peg") is not None for s in stocks),
                  "Technical History":sum(len(s.get("technical",{}).get("history",[]))>=100 for s in stocks),
              }
              print(f"{market}: "+", ".join(f"{k} {v}/{total}" for k,v in checks.items()))
          PY

      - name: Build lightweight radar payloads
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for market in ("canada", "india"):
              source=Path(f"data/{market}.json")
              data=json.loads(source.read_text(encoding="utf-8"))
              histories={}
              for stock in data.get("stocks", []):
                  ticker=stock.get("ticker") or stock.get("symbol") or stock.get("id")
                  technical=stock.get("technical") or {}
                  histories[ticker]={"history":technical.get("history",[])} if ticker else None
                  if ticker and "history" in technical:
                      technical.pop("history",None)
                  if ticker:
                      technical["historyAvailable"]=bool(histories[ticker] and histories[ticker]["history"])
              Path(f"data/{market}_radar.json").write_text(
                  json.dumps(data,separators=(",",":"),ensure_ascii=False),encoding="utf-8"
              )
              Path(f"data/history_{market}.json").write_text(
                  json.dumps({k:v for k,v in histories.items() if v},separators=(",",":"),ensure_ascii=False),encoding="utf-8"
              )
              print(f"Built lightweight {market} radar payload")
          PY

      - name: Commit updated data
        run: |
          git config user.name "Investment Radar"
          git config user.email "actions@github.com"
          git add \
            data/canada.json \
            data/india.json \
            data/canada_radar.json \
            data/india_radar.json \
            data/history_canada.json \
            data/history_india.json
          if git diff --cached --quiet; then
            echo "No investment data changes."
            exit 0
          fi
          git commit -m "Update investment data and technical history"
          git pull --rebase origin main
          git push
