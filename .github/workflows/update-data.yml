name: Update Investment Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * 1-5"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download latest Investment Universe
        run: |
          mkdir -p data
          curl -L --fail --retry 3 https://raw.githubusercontent.com/tusharkumar95/Investment_Universe/main/data/canada_universe.json -o data/canada.json
          curl -L --fail --retry 3 https://raw.githubusercontent.com/tusharkumar95/Investment_Universe/main/data/india_universe.json -o data/india.json

      - name: Validate Investment Universe
        run: |
          python -c "import json; checks=[('Canada','data/canada.json'),('India','data/india.json')]; [(lambda d,m,p: (_ for _ in ()).throw(SystemExit(f'{p} has unexpected market: {d.get(\"market\")}')) if d.get('market')!=m else (_ for _ in ()).throw(SystemExit(f'{p} contains {len(d.get(\"stocks\",[]))} stocks; expected 150')) if len(d.get('stocks',[]))!=150 else None)(json.load(open(p,encoding='utf-8')),m,p) for m,p in checks]; print('INVESTMENT UNIVERSE VALIDATION PASSED')"

      - name: Upgrade financial data engine
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/update_market_data.py")
          text = path.read_text(encoding="utf-8")

          # ------------------------------------------------------------
          # 1. Replace fundamentals builder with stronger fallbacks.
          # ------------------------------------------------------------
          start = text.index("def build_fundamentals(")
          end = text.index("# ============================================================\n# VALUATION", start)

          new_fundamentals = r'''def build_fundamentals(
      info,
      income,
      balance,
      cashflow
  ):

      revenue = first_valid(
          statement_latest(income, [
              "Total Revenue",
              "Operating Revenue",
              "Revenue"
          ]),
          info.get("totalRevenue")
      )

      net_income = first_valid(
          statement_latest(income, [
              "Net Income",
              "Net Income Common Stockholders",
              "Net Income Including Noncontrolling Interests"
          ]),
          info.get("netIncomeToCommon")
      )

      operating_income = first_valid(
          statement_latest(income, [
              "Operating Income",
              "Operating Income As Reported",
              "EBIT"
          ]),
          info.get("operatingIncome")
      )

      gross_profit = first_valid(
          statement_latest(income, ["Gross Profit"]),
          info.get("grossProfits")
      )

      ebitda = first_valid(
          statement_latest(income, [
              "EBITDA",
              "Normalized EBITDA"
          ]),
          info.get("ebitda")
      )

      operating_cash_flow = first_valid(
          statement_latest(cashflow, [
              "Operating Cash Flow",
              "Total Cash From Operating Activities",
              "Total Cash From Operating Activities Continuing Operations",
              "Cash Flow From Continuing Operating Activities"
          ]),
          info.get("operatingCashflow")
      )

      capex = first_valid(
          statement_latest(cashflow, [
              "Capital Expenditure",
              "Capital Expenditure Reported",
              "Purchase Of PPE",
              "Purchase Of Property Plant And Equipment",
              "Net PPE Purchase And Sale"
          ])
      )

      free_cash_flow = first_valid(
          statement_latest(cashflow, ["Free Cash Flow"]),
          info.get("freeCashflow")
      )

      # If Yahoo does not provide FCF directly, calculate it as
      # operating cash flow minus capital expenditure. Yahoo may
      # report capex as a negative cash-flow number, so use abs().
      if free_cash_flow is None and operating_cash_flow is not None and capex is not None:
          free_cash_flow = operating_cash_flow - abs(capex)

      cash = first_valid(
          statement_latest(balance, [
              "Cash Cash Equivalents And Short Term Investments",
              "Cash And Cash Equivalents",
              "Cash Financial",
              "Cash Equivalents"
          ]),
          info.get("totalCash")
      )

      total_debt = first_valid(
          statement_latest(balance, [
              "Total Debt",
              "Total Debt And Capital Lease Obligation",
              "Long Term Debt And Capital Lease Obligation",
              "Long Term Debt"
          ]),
          info.get("totalDebt")
      )

      total_assets = first_valid(
          statement_latest(balance, ["Total Assets"]),
          info.get("totalAssets")
      )

      equity = first_valid(
          statement_latest(balance, [
              "Stockholders Equity",
              "Total Stockholder Equity",
              "Total Equity Gross Minority Interest",
              "Total Equity",
              "Common Stock Equity"
          ]),
          info.get("stockholdersEquity")
      )

      eps = first_valid(
          info.get("trailingEps"),
          statement_latest(income, [
              "Diluted EPS",
              "Diluted EPS Continuing Operations",
              "Basic EPS",
              "Basic EPS Continuing Operations"
          ])
      )

      revenue_series = statement_series(income, [
          "Total Revenue",
          "Operating Revenue",
          "Revenue"
      ])
      revenue_growth = calculate_cagr_from_series(revenue_series)
      if revenue_growth is None:
          revenue_growth = pct_from_decimal(info.get("revenueGrowth"))

      eps_series = statement_series(income, [
          "Diluted EPS",
          "Diluted EPS Continuing Operations",
          "Basic EPS",
          "Basic EPS Continuing Operations"
      ])
      eps_growth = calculate_cagr_from_series(eps_series)
      if eps_growth is None:
          eps_growth = pct_from_decimal(info.get("earningsGrowth"))

      profit_margin = pct_from_decimal(info.get("profitMargins"))
      if profit_margin is None and revenue and net_income is not None:
          profit_margin = (net_income / revenue) * 100

      operating_margin = pct_from_decimal(info.get("operatingMargins"))
      if operating_margin is None and revenue and operating_income is not None:
          operating_margin = (operating_income / revenue) * 100

      gross_margin = pct_from_decimal(info.get("grossMargins"))
      if gross_margin is None and revenue and gross_profit is not None:
          gross_margin = (gross_profit / revenue) * 100

      roe = pct_from_decimal(info.get("returnOnEquity"))
      if roe is None and net_income is not None and equity:
          roe = (net_income / equity) * 100

      # ROIC hierarchy:
      # 1) calculated NOPAT / invested capital
      # 2) Yahoo returnOnTotalCapital
      roic = None
      if operating_income is not None:
          tax_rate = pct_from_decimal(info.get("taxRate"))
          if tax_rate is None:
              tax_rate = 25.0

          nopat = operating_income * (1 - tax_rate / 100)
          invested_capital = None

          if equity is not None:
              invested_capital = equity
              if total_debt is not None:
                  invested_capital += total_debt
              if cash is not None:
                  invested_capital -= cash

          if invested_capital is not None and invested_capital > 0:
              roic = (nopat / invested_capital) * 100

      if roic is None:
          roic = pct_from_decimal(info.get("returnOnTotalCapital"))

      debt_to_equity = ratio(info.get("debtToEquity"))
      if debt_to_equity is None and total_debt is not None and equity:
          debt_to_equity = total_debt / equity

      interest_expense = statement_latest(income, [
          "Interest Expense",
          "Interest Expense Non Operating",
          "Interest Expense Non-Operating"
      ])

      interest_coverage = None
      if operating_income is not None and interest_expense is not None:
          interest_expense = abs(interest_expense)
          if interest_expense > 0:
              interest_coverage = operating_income / interest_expense

      return clean_value({
          "revenue": revenue,
          "netIncome": net_income,
          "operatingIncome": operating_income,
          "grossProfit": gross_profit,
          "ebitda": ebitda,
          "freeCashFlow": free_cash_flow,
          "operatingCashFlow": operating_cash_flow,
          "capitalExpenditure": capex,
          "cash": cash,
          "totalDebt": total_debt,
          "totalAssets": total_assets,
          "stockholdersEquity": equity,
          "revenueGrowth5Y": revenue_growth,
          "epsGrowth5Y": eps_growth,
          "profitMargin": profit_margin,
          "operatingMargin": operating_margin,
          "grossMargin": gross_margin,
          "eps": eps,
          "roe": roe,
          "roic": roic,
          "debtToEquity": debt_to_equity,
          "interestCoverage": interest_coverage,
      })


'''

          text = text[:start] + new_fundamentals + text[end:]

          # ------------------------------------------------------------
          # 2. Add canonical PEG and Price/FCF fallbacks in valuation.
          # ------------------------------------------------------------
          marker = '        "peg": first_valid(\n            info.get(\n                "pegRatio"\n            )\n        ),'
          replacement = '''        "peg": first_valid(\n            info.get(\n                "pegRatio"\n            )\n        ),'''
          if marker not in text:
              raise SystemExit("Expected valuation PEG block was not found.")

          # Keep the existing valuation builder intact; PEG is enriched
          # immediately after it is called below using the actual EPS CAGR.
          
          process_marker = '''        valuation = (\n            build_valuation(\n                info\n            )\n        )'''
          process_replacement = '''        valuation = (\n            build_valuation(\n                info\n            )\n        )\n\n        # Canonical PEG fallback: P/E divided by positive EPS growth.\n        if (\n            valuation.get("peg") is None\n            and valuation.get("pe") is not None\n            and fundamentals.get("epsGrowth5Y") is not None\n            and fundamentals.get("epsGrowth5Y") > 0\n        ):\n            valuation["peg"] = (\n                valuation["pe"]\n                / fundamentals["epsGrowth5Y"]\n            )\n\n        # Canonical Price/FCF using market cap and FCF.\n        if (\n            valuation.get("priceToFcf") is None\n            and valuation.get("marketCap") is not None\n            and fundamentals.get("freeCashFlow") is not None\n            and fundamentals.get("freeCashFlow") > 0\n        ):\n            valuation["priceToFcf"] = (\n                valuation["marketCap"]\n                / fundamentals["freeCashFlow"]\n            )'''
          if process_marker not in text:
              raise SystemExit("Expected valuation call block was not found.")
          text = text.replace(process_marker, process_replacement, 1)

          # ------------------------------------------------------------
          # 3. Make valuation explicitly include Price/FCF.
          # ------------------------------------------------------------
          valuation_end_marker = '''        "priceToBook": first_valid(\n            info.get(\n                "priceToBook"\n            )\n        ),'''
          valuation_end_replacement = '''        "priceToBook": first_valid(\n            info.get(\n                "priceToBook"\n            )\n        ),\n\n        "priceToFcf": first_valid(\n            info.get("priceToFreeCashFlow"),\n            info.get("priceToCashFlow")\n        ),'''
          if valuation_end_marker not in text:
              raise SystemExit("Expected valuation Price/Book block was not found.")
          text = text.replace(valuation_end_marker, valuation_end_replacement, 1)

          # ------------------------------------------------------------
          # 4. Persist the upgraded updater so this is not just a runtime patch.
          # ------------------------------------------------------------
          path.write_text(text, encoding="utf-8")
          print("Financial data engine upgrade applied.")
          PY

      - name: Repair updater syntax before compile
        run: |
          python -c "from pathlib import Path; p=Path('scripts/update_market_data.py'); s=p.read_text(encoding='utf-8'); old='''        print(\"\")\n        print(\n            f\"Price batch \"\n            f\"{start + 1}-\"\n            f\"{min(\"\n                start + BATCH_SIZE,\n                len(tickers)\n            )}\"\n        )'''; new='''        end = min(start + BATCH_SIZE, len(tickers))\n        print(\"\")\n        print(f\"Price batch {start + 1}-{end}\")'''; assert old in s or 'print(f\"Price batch {start + 1}-{end}\")' in s, 'Expected updater price batch block not found'; p.write_text(s.replace(old,new,1) if old in s else s,encoding='utf-8'); print('Updater syntax repaired or already fixed.')"

      - name: Syntax check updater
        run: python -m py_compile scripts/update_market_data.py

      - name: Update market data
        run: python scripts/update_market_data.py

      - name: Verify generated data
        run: |
          python -c "import json; files=['data/canada.json','data/india.json']; [(lambda d,p: (_ for _ in ()).throw(SystemExit(f'{p} contains too few stocks')) if len(d.get('stocks',[]))<100 else (_ for _ in ()).throw(SystemExit(f'{p} contains NO actual price data')) if not any(isinstance(s.get('price'),dict) and s['price'].get('current') is not None for s in d.get('stocks',[])) else (_ for _ in ()).throw(SystemExit(f'{p} contains NO fundamentals data')) if not any(isinstance(s.get('fundamentals'),dict) for s in d.get('stocks',[])) else (_ for _ in ()).throw(SystemExit(f'{p} contains NO valuation data')) if not any(isinstance(s.get('valuation'),dict) for s in d.get('stocks',[])) else (_ for _ in ()).throw(SystemExit(f'{p} contains NO technical data')) if not any(isinstance(s.get('technical'),dict) for s in d.get('stocks',[])) else print(f'{p}: {len(d.get(\"stocks\",[]))} stocks - validation passed'))(json.load(open(p,encoding='utf-8')),p) for p in files]; print('DATA VALIDATION PASSED')"

      - name: Validate financial coverage
        run: |
          python - <<'PY'
          import json

          thresholds = {
              "roic": 40,
              "roe": 70,
              "freeCashFlow": 70,
              "peg": 50,
          }

          for market, path in [("Canada", "data/canada.json"), ("India", "data/india.json")]:
              data = json.load(open(path, encoding="utf-8"))
              stocks = data.get("stocks", [])
              total = len(stocks)

              checks = {
                  "roic": sum(s.get("fundamentals", {}).get("roic") is not None for s in stocks),
                  "roe": sum(s.get("fundamentals", {}).get("roe") is not None for s in stocks),
                  "freeCashFlow": sum(s.get("fundamentals", {}).get("freeCashFlow") is not None for s in stocks),
                  "peg": sum(s.get("valuation", {}).get("peg") is not None for s in stocks),
              }

              print(f"{market} financial coverage:")
              for metric, count in checks.items():
                  pct = count / total * 100 if total else 0
                  print(f"  {metric}: {count}/{total} ({pct:.1f}%)")
                  if pct < thresholds[metric]:
                      raise SystemExit(
                          f"FAIL: {market} {metric} coverage {pct:.1f}% is below {thresholds[metric]}%"
                      )

          print("FINANCIAL COVERAGE VALIDATION PASSED")
          PY

      - name: Commit updated data and engine
        run: |
          git config user.name "Investment Radar"
          git config user.email "actions@github.com"
          git add data/*.json scripts/update_market_data.py
          git diff --cached --quiet || git commit -m "Upgrade financial data engine and refresh investment data"
          git push
