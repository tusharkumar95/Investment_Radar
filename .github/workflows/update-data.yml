name: Update Investment Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * 1-5"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download latest Investment Universe
        run: |
          mkdir -p data
          curl -L --fail --retry 3 https://raw.githubusercontent.com/tusharkumar95/Investment_Universe/main/data/canada_universe.json -o data/canada.json
          curl -L --fail --retry 3 https://raw.githubusercontent.com/tusharkumar95/Investment_Universe/main/data/india_universe.json -o data/india.json

      - name: Validate Investment Universe
        run: |
          python -c "import json; checks=[('Canada','data/canada.json'),('India','data/india.json')]; [(lambda d,m,p: (_ for _ in ()).throw(SystemExit(f'{p} has unexpected market: {d.get(\"market\")}')) if d.get('market')!=m else (_ for _ in ()).throw(SystemExit(f'{p} contains {len(d.get(\"stocks\",[]))} stocks; expected 150')) if len(d.get('stocks',[]))!=150 else None)(json.load(open(p,encoding='utf-8')),m,p) for m,p in checks]; print('INVESTMENT UNIVERSE VALIDATION PASSED')"

      - name: Repair updater syntax before compile
        run: |
          python -c "from pathlib import Path; p=Path('scripts/update_market_data.py'); s=p.read_text(encoding='utf-8'); old='''        print(\"\")\n        print(\n            f\"Price batch \"\n            f\"{start + 1}-\"\n            f\"{min(\"\n                start + BATCH_SIZE,\n                len(tickers)\n            )}\"\n        )'''; new='''        end = min(start + BATCH_SIZE, len(tickers))\n        print(\"\")\n        print(f\"Price batch {start + 1}-{end}\")'''; assert old in s, 'Expected updater syntax block not found'; p.write_text(s.replace(old,new,1),encoding='utf-8'); print('Updater syntax repaired before compile.')"

      - name: Syntax check updater
        run: python -m py_compile scripts/update_market_data.py

      - name: Update market data
        run: python scripts/update_market_data.py

      - name: Verify generated data
        run: |
          python -c "import json; files=['data/canada.json','data/india.json']; [(lambda d,p: (_ for _ in ()).throw(SystemExit(f'{p} contains too few stocks')) if len(d.get('stocks',[]))<100 else (_ for _ in ()).throw(SystemExit(f'{p} contains NO actual price data')) if not any(isinstance(s.get('price'),dict) and s['price'].get('current') is not None for s in d.get('stocks',[])) else (_ for _ in ()).throw(SystemExit(f'{p} contains NO fundamentals data')) if not any(isinstance(s.get('fundamentals'),dict) for s in d.get('stocks',[])) else (_ for _ in ()).throw(SystemExit(f'{p} contains NO valuation data')) if not any(isinstance(s.get('valuation'),dict) for s in d.get('stocks',[])) else (_ for _ in ()).throw(SystemExit(f'{p} contains NO technical data')) if not any(isinstance(s.get('technical'),dict) for s in d.get('stocks',[])) else print(f'{p}: {len(d.get(\"stocks\",[]))} stocks - validation passed'))(json.load(open(p,encoding='utf-8')),p) for p in files]; print('DATA VALIDATION PASSED')"

      - name: Commit updated data
        run: |
          git config user.name "Investment Radar"
          git config user.email "actions@github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "Update investment data"
          git push
