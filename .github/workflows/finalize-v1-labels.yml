name: Finalize V1 Frontend Labels

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-v1-labels.yml"

permissions:
  contents: write

concurrency:
  group: investment-radar-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update v1 labels and cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<span style="display:block;color:#7b8590;font-size:11px;font-weight:900;">SMALL CAP</span><strong style="display:block;font-size:25px;margin:5px 0;">V2</strong>'
          new='<span style="display:block;color:#7b8590;font-size:11px;font-weight:900;">SMALL CAP</span><strong style="display:block;font-size:25px;margin:5px 0;">V3</strong>'
          if old not in s and '>V3</strong>' not in s:
              raise SystemExit('Expected Small Cap V2 home label not found')
          s=s.replace(old,new,1)
          s=s.replace('?v=1.0.0','?v=1.0.2')
          p.write_text(s,encoding='utf-8')
          print('Home label set to V3 and cache keys set to 1.0.2')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "Investment Radar"
          git config user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Finalize v1 frontend labels and cache keys"
          git pull --rebase origin main
          git push
