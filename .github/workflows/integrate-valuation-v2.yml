name: Integrate Valuation V2

on:
  push:
    paths:
      - "engine/valuationV2.js"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add valuation v2 to index
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          tag = '    <script src="engine/valuationV2.js"></script>\n'
          if 'src="engine/valuationV2.js"' not in text:
              marker = '    <script src="engine/valuation.js"></script>\n'
              if marker not in text:
                  raise SystemExit("Expected valuation.js script tag was not found.")
              text = text.replace(marker, marker + tag, 1)
              path.write_text(text, encoding="utf-8")
              print("Valuation v2 added to index.html")
          else:
              print("Valuation v2 is already loaded.")
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/integrate-valuation-v2.yml

      - name: Commit integration
        run: |
          git config user.name "Investment Radar"
          git config user.email "actions@github.com"
          git add index.html .github/workflows/integrate-valuation-v2.yml
          git diff --cached --quiet || git commit -m "Integrate valuation engine v2"
          git push
