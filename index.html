<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Investment Radar</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="app">

        <!-- ================================
             MARKET SELECTOR
        ================================= -->

        <div class="market-selector">

            <button
                class="market-btn active"
                data-market="Canada"
                onclick="selectMarket('Canada', this)"
            >
                🇨🇦 Canada
            </button>

            <button
                class="market-btn"
                data-market="India"
                onclick="selectMarket('India', this)"
            >
                🇮🇳 India
            </button>

        </div>


        <!-- ================================
             VIEW SELECTOR
        ================================= -->

        <div class="view-selector">

            <button
                class="view-btn active"
                data-view="Long Term"
                onclick="selectView('Long Term', this)"
            >
                🏗️ Long Term
            </button>

            <button
                class="view-btn"
                data-view="Short Term"
                onclick="selectView('Short Term', this)"
            >
                ⚡ Short Term
            </button>

        </div>


        <!-- ================================
             RADAR VIEW
        ================================= -->

        <div id="radarView">


            <!-- HEADER -->

            <section class="hero">

                <h1 id="pageTitle">
                    Canada Long Term Radar
                </h1>

                <p id="pageDescription">
                    Finding high-quality investments with
                    attractive fundamentals, valuation and
                    margin of safety.
                </p>

            </section>


            <!-- STATISTICS -->

            <section class="stats-grid">

                <div class="stat-card">

                    <span>
                        STOCKS SCANNED
                    </span>

                    <strong id="stockCount">
                        0
                    </strong>

                </div>


                <div class="stat-card">

                    <span>
                        STRONG CANDIDATES
                    </span>

                    <strong id="candidateCount">
                        0
                    </strong>

                </div>


                <div class="stat-card">

                    <span>
                        WATCHLIST
                    </span>

                    <strong id="watchlistCount">
                        0
                    </strong>

                </div>

            </section>


            <!-- INVESTMENTS -->

            <section class="opportunities">

                <h2>
                    ⭐ Top opportunities
                </h2>

                <div id="investments">

                    <div class="investment">

                        <div class="investment-info">

                            <h3>
                                Loading...
                            </h3>

                            <p>
                                Loading investment data
                            </p>

                        </div>

                    </div>

                </div>

            </section>

        </div>


        <!-- ================================
             DETAIL VIEW
        ================================= -->

        <div
            id="detailView"
            style="display:none;"
        ></div>

    </main>


    <!-- ================================
         JAVASCRIPT
    ================================= -->

    <script src="engine/scoring.js"></script>

    <script src="engine/dataQuality.js"></script>

    <script src="detail.js"></script>

    <script src="app.js"></script>

</body>

</html>
