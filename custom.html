<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4f6f8">
<title>My Stock — Investment Radar</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.app{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.back{border:0;background:#fff;border-radius:14px;padding:12px 16px;font-weight:700;cursor:pointer;box-shadow:0 5px 15px rgba(20,30,40,.05)}h1{font-size:42px;margin:0 0 8px;letter-spacing:-1.5px}.sub{color:#68737e;font-size:17px;line-height:1.5;margin-bottom:22px}.search{background:#fff;border-radius:24px;padding:22px;box-shadow:0 8px 25px rgba(20,30,40,.06);margin-bottom:18px}.row{display:flex;gap:10px}.ticker{flex:1;border:1px solid #d8dde3;border-radius:14px;padding:15px;font-size:18px;font-weight:700;text-transform:uppercase}.market{border:1px solid #d8dde3;border-radius:14px;padding:15px;background:#fff;font-weight:700}.run{border:0;background:#18212b;color:#fff;border-radius:14px;padding:15px 22px;font-weight:800;cursor:pointer}.hint{color:#7b8590;font-size:13px;margin-top:10px}.status{margin:18px 0;font-weight:700}.section{background:#fff;border-radius:24px;padding:24px;margin-bottom:16px;box-shadow:0 8px 25px rgba(20,30,40,.05)}.title{font-size:20px;font-weight:800;margin-bottom:18px}.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.price{font-size:46px;font-weight:900}.pill{display:inline-block;padding:7px 12px;border-radius:12px;font-weight:800;background:#f0f2f5}.bull{background:#dff5e6;color:#26733d}.bear{background:#f9dddd;color:#a13e3e}.mixed{background:#fff1c7;color:#886300}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{background:#f6f7f9;border-radius:15px;padding:16px}.label{display:block;color:#7a8590;font-size:13px;font-weight:600;margin-bottom:6px}.value{display:block;font-size:18px;font-weight:800}.targets{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.target{padding:18px;border-radius:18px;background:#f6f7f9}.target strong{display:block;font-size:28px;margin-top:8px}.condition{padding:12px 0;border-bottom:1px solid #eef0f2;color:#56616c;line-height:1.5}.chart{width:100%;height:280px;background:#f6f7f9;border-radius:18px;padding:12px}.chart svg{width:100%;height:100%}.muted{color:#68737e}.warning{background:#fff7df;color:#735900;border-radius:14px;padding:14px;font-weight:700}.error{background:#f9dddd;color:#8b3030;border-radius:14px;padding:14px;font-weight:700}@media(max-width:700px){.app{padding:14px}h1{font-size:32px}.row{flex-wrap:wrap}.ticker,.market,.run{width:100%}.hero{grid-template-columns:1fr}.grid,.targets{grid-template-columns:1fr 1fr}.section{padding:20px}}@media(max-width:420px){.grid,.targets{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app">
<div class="top"><button class="back" onclick="location.href='index.html'">← Investment Radar</button></div>
<h1>My Stock / Custom Analysis</h1>
<p class="sub">Enter any exact ticker and build a technical analysis even when the stock is outside our 150-stock Radar universe.</p>
<div class="search">
<div class="row">
<input id="ticker" class="ticker" placeholder="GFL.TO or TATAPOWER" autocomplete="off">
<select id="market" class="market"><option value="Canada">🇨🇦 Canada</option><option value="India">🇮🇳 India</option></select>
<button class="run" onclick="runAnalysis()">Analyze</button>
</div>
<div class="hint">Canada: use Yahoo-style tickers such as GFL.TO. India: type the NSE symbol such as TATAPOWER; .NS is added automatically.</div>
</div>
<div id="status" class="status muted">Enter a ticker to begin.</div>
<div id="result"></div>
</main>
<script src="engine/technicalAnalysis.js"></script>
<script src="engine/priceTarget.js"></script>
<script>
const $=id=>document.getElementById(id);
function money(v){return Number.isFinite(Number(v))?Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—'}
function pct(v){return Number.isFinite(Number(v))?`${Number(v).toFixed(1)}%`:'—'}
function ratio(v){return Number.isFinite(Number(v))?Number(v).toFixed(2):'—'}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function yahooTicker(raw,market){let t=raw.trim().toUpperCase();if(market==='India'&&!t.includes('.'))t+='.NS';return t}
function rowsFromYahoo(json){const r=json?.chart?.result?.[0];if(!r)throw new Error('Ticker not found. Check the exact symbol.');const q=r.indicators?.quote?.[0]||{},adj=r.indicators?.adjclose?.[0]?.adjclose||[];return (r.timestamp||[]).map((ts,i)=>({date:new Date(ts*1000).toISOString().slice(0,10),open:Number(q.open?.[i]),high:Number(q.high?.[i]),low:Number(q.low?.[i]),close:Number(adj[i]??q.close?.[i]),volume:Number(q.volume?.[i])})).filter(x=>Number.isFinite(x.close))}
function makeStock(ticker,rows){const last=rows.at(-1);return {ticker,name:ticker,price:{current:last.close},technical:{history:rows}}
}
function svgChart(rows){const r=rows.slice(-180),w=900,h=250,p=18,vals=r.map(x=>x.close),lo=Math.min(...vals),hi=Math.max(...vals),x=i=>p+i*(w-2*p)/Math.max(1,r.length-1),y=v=>h-p-(v-lo)/(hi-lo||1)*(h-2*p),pts=r.map((z,i)=>`${x(i).toFixed(1)},${y(z.close).toFixed(1)}`).join(' ');return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="3" vector-effect="non-scaling-stroke"/><line x1="${p}" x2="${w-p}" y1="${h-p}" y2="${h-p}" stroke="#d8dde3"/></svg>`}
async function runAnalysis(){const raw=$("ticker").value.trim();const market=$("market").value;if(!raw){$("status").textContent='Enter a ticker.';return}const ticker=yahooTicker(raw,market);$("status").textContent=`Loading ${ticker}…`;$("result").innerHTML='';try{const url=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?range=2y&interval=1d&events=history&includeAdjustedClose=true`;const res=await fetch(url);if(!res.ok)throw new Error(`Market-data request failed (${res.status}).`);const json=await res.json();const rows=rowsFromYahoo(json);if(rows.length<100)throw new Error('Not enough historical data for reliable technical analysis.');const stock=makeStock(ticker,rows);const ta=window.radarTechnicalAnalysis(stock);const pt=window.radarPriceTarget(stock);const cls=ta.outlook==='Bullish'?'bull':ta.outlook==='Bearish'?'bear':'mixed';const support=ta.support?.slice(0,2).map(money).join(' / ')||'—';const resistance=ta.resistance?.slice(0,2).map(money).join(' / ')||'—';$("status").textContent=`Analysis built for ${ticker} from ${rows.length} trading days of price history.`;$("result").innerHTML=`<section class="section hero"><div><div class="muted">${esc(market)} · Custom ticker</div><h2>${esc(ticker)}</h2><div class="price">$${money(ta.current)}</div><span class="pill ${cls}">${esc(ta.outlook)}</span></div><div class="chart">${svgChart(rows)}</div></section><section class="section"><div class="title">Technical Snapshot</div><div class="grid"><div class="metric"><span class="label">Trend</span><span class="value">${esc(ta.trend)}</span></div><div class="metric"><span class="label">Momentum</span><span class="value">${esc(ta.momentum)}</span></div><div class="metric"><span class="label">RSI(14)</span><span class="value">${ratio(ta.rsi)}</span></div><div class="metric"><span class="label">MACD</span><span class="value">${esc(ta.macdBias)}</span></div><div class="metric"><span class="label">Candlestick</span><span class="value">${esc(ta.candle.name)}</span></div><div class="metric"><span class="label">Volume</span><span class="value">${esc(ta.volume.confirmation)}</span></div><div class="metric"><span class="label">SMA 50</span><span class="value">${money(ta.sma50)}</span></div><div class="metric"><span class="label">SMA 200</span><span class="value">${money(ta.sma200)}</span></div><div class="metric"><span class="label">ATR(14)</span><span class="value">${money(ta.atr)}</span></div></div></section><section class="section"><div class="title">Support & Resistance</div><div class="grid"><div class="metric"><span class="label">Support</span><span class="value">${support}</span></div><div class="metric"><span class="label">Resistance</span><span class="value">${resistance}</span></div><div class="metric"><span class="label">Candlestick Bias</span><span class="value">${esc(ta.candle.bias)}</span></div></div></section><section class="section"><div class="title">6-Month Price Target</div><div class="targets"><div class="target"><span class="label">Bear Case</span><strong>$${money(pt.bearTarget)}</strong></div><div class="target"><span class="label">Base Target</span><strong>$${money(pt.baseTarget)}</strong></div><div class="target"><span class="label">Bull Case</span><strong>$${money(pt.bullTarget)}</strong></div><div class="target"><span class="label">Upside</span><strong>${pct(pt.upside)}</strong></div></div><div class="grid" style="margin-top:12px"><div class="metric"><span class="label">Technical Target</span><span class="value">$${money(pt.technicalTarget)}</span></div><div class="metric"><span class="label">Target Confidence</span><span class="value">${pt.confidence}% · ${esc(pt.confidenceLabel)}</span></div><div class="metric"><span class="label">Invalidation</span><span class="value">$${money(pt.invalidation)}</span></div></div></section><section class="section"><div class="title">What Needs To Happen</div>${pt.conditions.map(x=>`<div class="condition">${esc(x)}</div>`).join('')}<p class="muted" style="margin-bottom:0">This is a model estimate, not a guarantee or a promise of future price performance. Custom tickers outside the Radar universe currently use technical/price-action analysis; the full fundamental layer will be added to custom coverage next.</p></section>`}catch(e){$("status").textContent='';$("result").innerHTML=`<div class="error">${esc(e.message)}<br><br>Try the exact Yahoo Finance ticker, for example <b>GFL.TO</b> or <b>TATAPOWER.NS</b>.</div>`}}
$("ticker").addEventListener('keydown',e=>{if(e.key==='Enter')runAnalysis()});
</script>
</body>
</html>
