<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fa"><title>Portfolio · Investment Radar</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.btn{border:1px solid #dfe4e8;background:#fff;border-radius:13px;padding:10px 13px;font-weight:800}.hero{background:rgba(255,255,255,.82);backdrop-filter:blur(18px);border-radius:24px;padding:22px;box-shadow:0 10px 35px rgba(20,30,40,.06)}h1{margin:0 0 5px;font-size:31px}.muted{color:#707b86}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}.stat{background:#fff;border:1px solid #e2e7eb;border-radius:17px;padding:14px}.stat b{display:block;font-size:21px;margin-top:3px}.form{margin-top:12px;background:#fff;border-radius:19px;padding:14px;border:1px solid #e2e7eb;display:grid;grid-template-columns:.8fr 1.2fr .8fr .8fr auto;gap:8px}input,select{width:100%;border:1px solid #dce2e7;border-radius:12px;padding:11px;font:inherit}.add{background:#17202a;color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:800}.list{display:grid;gap:8px;margin-top:12px}.card{background:#fff;border:1px solid #e2e7eb;border-radius:18px;padding:14px}.row{display:flex;justify-content:space-between}.ticker{font-weight:900}.meta{color:#707b86;font-size:13px;margin-top:5px}.remove{border:0;background:#f1f3f5;border-radius:9px;padding:6px 9px}.empty{text-align:center;padding:30px;color:#74808a}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr 1fr}.form .add{grid-column:span 2}}
@media(max-width:650px){html,body{overflow-x:hidden}body{padding-bottom:env(safe-area-inset-bottom)}.wrap{padding:12px max(12px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}.top{gap:8px}.btn,.add,input,select{min-height:44px}.hero{padding:18px}.stats{grid-template-columns:1fr 1fr}.stat{padding:12px}.stat b{font-size:18px;overflow-wrap:anywhere}.form{grid-template-columns:1fr;padding:12px}.form .add{grid-column:auto}.row{gap:10px}.card{overflow:hidden}.meta{overflow-wrap:anywhere}}@media(max-width:390px){.stats{grid-template-columns:1fr}.top strong{font-size:14px}}
@media(max-width:650px){html{-webkit-text-size-adjust:100%}input,select{font-size:16px!important}.stats{grid-template-columns:1fr 1fr}.card{padding:14px}.row{align-items:flex-start}.row>div:first-child{min-width:0;overflow-wrap:anywhere}}
@media(max-width:360px){.stats{grid-template-columns:1fr}}

@media(max-width:700px){a,button,input,select{-webkit-tap-highlight-color:transparent}button,a,.btn,.back,.nav,.tab,.market,.run,.add{touch-action:manipulation}input,select{font-size:16px!important}}

/* v1 mobile release overrides */
@media(max-width:700px){html{-webkit-text-size-adjust:100%}html,body{overflow-x:hidden}body{padding-bottom:env(safe-area-inset-bottom)}a,button,input,select{-webkit-tap-highlight-color:transparent;touch-action:manipulation}button,input,select,.back,.nav,.tab,.market,.run,.add,.btn{min-height:44px}input,select{font-size:16px!important}}
</style></head><body><div class="wrap"><div class="top"><strong>Investment Radar</strong><button class="btn" onclick="location.href='index.html'">← Stocks</button></div><section class="hero"><h1>My Portfolio</h1><div class="muted">Private to this browser. Nothing is sent to a server.</div></section><div class="stats"><div class="stat">Canada Value<b id="canadaValue">—</b></div><div class="stat">Canada P/L<b id="canadaGain">—</b></div><div class="stat">India Value<b id="indiaValue">—</b></div><div class="stat">India P/L<b id="indiaGain">—</b></div></div><div id="health" class="card" style="margin-top:12px;"></div><div id="risk" class="card" style="margin-top:10px;"></div><div class="form"><select id="market"><option value="Canada">🇨🇦 Canada</option><option value="India">🇮🇳 India</option></select><input id="ticker" placeholder="Ticker e.g. SHOP.TO"><input id="shares" type="number" step="any" placeholder="Shares"><input id="cost" type="number" step="any" placeholder="Avg cost"><button class="add" onclick="addHolding()">Add</button></div><div id="list" class="list"></div></div><script src="engine/scoring.js?v=20260921"></script><script src="engine/dataQuality.js?v=20260924"></script><script src="engine/psychology.js?v=20260921"></script><script src="engine/valuation.js?v=20260921"></script><script src="engine/valuationV2.js?v=20260924"></script><script src="engine/scoringV2.js?v=20260924"></script><script src="engine/decisionEngine.js?v=20260924"></script><script src="engine/portfolio.js?v=20261003v4"></script><script>
let marketData={Canada:{},India:{}};
async function getData(){for(const market of ['Canada','India']){try{const d=await fetch('data/'+market.toLowerCase()+'_radar.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json());for(const s of d.stocks||[]){const p=s.price&&typeof s.price==='object'?s.price:{};s.price=Number(s.currentPrice??s.price??p.current??s.technical?.currentPrice)||null;s.currentPrice=s.price;s._market=market;marketData[market][s.ticker]=s}}catch(e){console.error(market,e)}}}
function money(n,market){return n==null?'—':(market==='India'?'₹':'$')+Number(n).toLocaleString(market==='India'?'en-IN':'en-CA',{maximumFractionDigits:2})}
function radarFor(s){if(!s||typeof window.getRadarDecision!=='function')return null;try{return window.getRadarDecision(s,'Long Term')}catch(e){return null}}
function resolve(x){if(x.market&&marketData[x.market]?.[x.ticker])return {market:x.market,s:marketData[x.market][x.ticker]};for(const m of ['Canada','India'])if(marketData[m][x.ticker]){PORTFOLIO.migrateMarket(x.ticker,m);return {market:m,s:marketData[m][x.ticker]}}return {market:x.market||null,s:null}}
function analyze(items,market){const rows=items.filter(x=>x.market===market),known=rows.filter(x=>x.val!=null),value=known.reduce((a,x)=>a+x.val,0),invested=rows.reduce((a,x)=>a+x.inv,0),sectors={};known.forEach(x=>{const sec=x.s?.sector||x.s?.profile?.sector||'Unknown';sectors[sec]=(sectors[sec]||0)+x.val});const sorted=[...known].sort((a,b)=>b.val-a.val),largest=sorted[0],largestPct=largest&&value?largest.val/value*100:0,top3=value?sorted.slice(0,3).reduce((a,x)=>a+x.val,0)/value*100:0,topSector=Object.entries(sectors).sort((a,b)=>b[1]-a[1])[0],sectorPct=topSector&&value?topSector[1]/value*100:0,radarKnown=known.filter(x=>x.d),radarValue=radarKnown.reduce((a,x)=>a+x.val,0),score=radarValue?radarKnown.reduce((a,x)=>a+x.val*x.d.score,0)/radarValue:null,flags=[];if(largestPct>25)flags.push('Largest holding '+largest.x.ticker+' is '+largestPct.toFixed(1)+'%.');if(sectorPct>35)flags.push((topSector?.[0]||'Largest sector')+' is '+sectorPct.toFixed(1)+'%.');if(top3>65&&rows.length>3)flags.push('Top 3 holdings are '+top3.toFixed(1)+'% of this market portfolio.');if(rows.length&&rows.length<5)flags.push('Fewer than 5 holdings; company-specific risk is concentrated.');return {rows,value,invested,gain:value-invested,largest,largestPct,top3,topSector,sectorPct,score,flags}}
function render(){const stored=PORTFOLIO.load(),enriched=stored.map(x=>{const r=resolve(x),s=r.s,market=r.market,sh=Number(x.shares)||0,cost=Number(x.avgCost)||0,p=s?.price??null,inv=sh*cost,val=p==null?null:sh*p,d=radarFor(s);return{x:{...x,market},market,s,sh,cost,p,inv,val,d}}),ca=analyze(enriched,'Canada'),ind=analyze(enriched,'India'),list=document.getElementById('list');document.getElementById('canadaValue').textContent=money(ca.value,'Canada');document.getElementById('canadaGain').textContent=money(ca.gain,'Canada');document.getElementById('indiaValue').textContent=money(ind.value,'India');document.getElementById('indiaGain').textContent=money(ind.gain,'India');
if(!stored.length)list.innerHTML='<div class="empty">No holdings yet. Add your first position above.</div>';else list.innerHTML=enriched.map(z=>{const gl=z.val==null?null:z.val-z.inv,a=z.market==='India'?ind:ca,w=a.value&&z.val!=null?z.val/a.value*100:null;return `<article class="card"><div class="row"><div><div class="ticker">${z.x.ticker} · ${z.market||'Market unknown'}</div><div class="meta">${z.sh} shares · Avg ${money(z.cost,z.market)} · Current ${money(z.p,z.market)}</div></div><button class="remove" onclick="PORTFOLIO.remove('${z.x.ticker}','${z.market||''}');render()">Remove</button></div><div class="meta">Value ${money(z.val,z.market)} · P/L ${money(gl,z.market)} · ${z.market||'Market'} weight ${w==null?'—':w.toFixed(1)+'%'}</div><div class="meta" style="margin-top:7px;font-weight:800;">Radar: ${z.d?z.d.verdict+' · '+Math.round(z.d.score)+'/100 · '+z.d.priceZone:'Ticker not in current Radar universe'}</div></article>`}).join('');
const attractive=enriched.filter(x=>['STRONG BUY','BUY','ACCUMULATE'].includes(x.d?.verdict)).length,weak=enriched.filter(x=>['WAIT','AVOID'].includes(x.d?.verdict)).length;document.getElementById('health').innerHTML='<strong>Portfolio Radar</strong><div class="meta" style="line-height:1.8;margin-top:7px;">Attractive holdings: <b>'+attractive+'</b> · Wait/Avoid: <b>'+weak+'</b><br>Canada Radar score: <b>'+(ca.score==null?'—':ca.score.toFixed(0)+'/100')+'</b> · India Radar score: <b>'+(ind.score==null?'—':ind.score.toFixed(0)+'/100')+'</b></div>';
function marketLine(name,a){if(!a.rows.length)return '<b>'+name+':</b> no holdings';return '<b>'+name+':</b> Largest '+(a.largest?a.largest.x.ticker+' '+a.largestPct.toFixed(1)+'%':'—')+' · Top 3 '+a.top3.toFixed(1)+'% · Largest sector '+(a.topSector?a.topSector[0]+' '+a.sectorPct.toFixed(1)+'%':'—')+(a.flags.length?'<br>'+a.flags.map(f=>'⚠ '+f).join('<br>'):'<br>✓ No major concentration flags from tracked holdings.')}
document.getElementById('risk').innerHTML='<strong>Risk & Diversification</strong><div class="meta" style="line-height:1.8;margin-top:7px;">'+marketLine('Canada',ca)+'<br><br>'+marketLine('India',ind)+'<br><br><span>CAD and INR are intentionally analyzed separately. No FX conversion is assumed.</span></div>'}
async function addHolding(){const market=document.getElementById('market').value,ticker=document.getElementById('ticker').value.trim().toUpperCase(),shares=Number(document.getElementById('shares').value),avgCost=Number(document.getElementById('cost').value);if(!ticker||!shares||!avgCost)return alert('Enter market, ticker, shares and average cost.');PORTFOLIO.add({market,ticker,shares,avgCost});document.getElementById('ticker').value='';document.getElementById('shares').value='';document.getElementById('cost').value='';render()}
getData().then(render);</script></body></html>
