<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fa"><title>Portfolio · Investment Radar</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.btn{border:1px solid #dfe4e8;background:#fff;border-radius:13px;padding:10px 13px;font-weight:800}.hero{background:rgba(255,255,255,.82);backdrop-filter:blur(18px);border-radius:24px;padding:22px;box-shadow:0 10px 35px rgba(20,30,40,.06)}h1{margin:0 0 5px;font-size:31px}.muted{color:#707b86}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}.stat{background:#fff;border:1px solid #e2e7eb;border-radius:17px;padding:14px}.stat b{display:block;font-size:21px;margin-top:3px}.form{margin-top:12px;background:#fff;border-radius:19px;padding:14px;border:1px solid #e2e7eb;display:grid;grid-template-columns:1.2fr .8fr .8fr auto;gap:8px}input{width:100%;border:1px solid #dce2e7;border-radius:12px;padding:11px;font:inherit}.add{background:#17202a;color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:800}.list{display:grid;gap:8px;margin-top:12px}.card{background:#fff;border:1px solid #e2e7eb;border-radius:18px;padding:14px}.row{display:flex;justify-content:space-between}.ticker{font-weight:900}.meta{color:#707b86;font-size:13px;margin-top:5px}.remove{border:0;background:#f1f3f5;border-radius:9px;padding:6px 9px}.empty{text-align:center;padding:30px;color:#74808a}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr 1fr}.form .add{grid-column:span 2}}
</style></head><body><div class="wrap"><div class="top"><strong>Investment Radar</strong><button class="btn" onclick="location.href='index.html'">← Stocks</button></div><section class="hero"><h1>My Portfolio</h1><div class="muted">Private to this browser. Nothing is sent to a server.</div></section><div class="stats"><div class="stat">Invested<b id="invested">—</b></div><div class="stat">Value<b id="value">—</b></div><div class="stat">Gain / Loss<b id="gain">—</b></div></div><div class="form"><input id="ticker" placeholder="Ticker e.g. SHOP.TO"><input id="shares" type="number" step="any" placeholder="Shares"><input id="cost" type="number" step="any" placeholder="Avg cost"><button class="add" onclick="addHolding()">Add</button></div><div id="list" class="list"></div></div><script src="engine/portfolio.js"></script><script>
let marketData={};
async function getData(){for(const f of ['data/canada.json','data/india.json']){try{const d=await fetch(f+'?'+Date.now()).then(r=>r.json());for(const s of d.stocks||[])marketData[s.ticker]=s}catch(e){}}}
function priceFor(t){const s=marketData[t];return s?.price?.current??s?.technical?.currentPrice??s?.technical?.price??null}
function money(n){return n==null?'—':Number(n).toLocaleString(undefined,{maximumFractionDigits:2})}
function render(){const rows=PORTFOLIO.load();let invested=0,value=0;const list=document.getElementById('list');if(!rows.length){list.innerHTML='<div class="empty">No holdings yet. Add your first position above.</div>'}else{list.innerHTML=rows.map(x=>{const sh=Number(x.shares)||0,cost=Number(x.avgCost)||0,p=priceFor(x.ticker),inv=sh*cost,val=p==null?null:sh*p;invested+=inv==null?inv||0:inv;value+=val==null?0:val;const gl=val==null?null:val-inv;return `<article class="card"><div class="row"><div><div class="ticker">${x.ticker}</div><div class="meta">${sh} shares · Avg ${money(cost)} · Current ${money(p)}</div></div><button class="remove" onclick="PORTFOLIO.remove('${x.ticker}');render()">Remove</button></div><div class="meta">Value ${money(val)} · P/L ${money(gl)}</div></article>`}).join('')}
 document.getElementById('invested').textContent=money(invested);document.getElementById('value').textContent=money(value);document.getElementById('gain').textContent=money(value-invested);
}
async function addHolding(){const ticker=document.getElementById('ticker').value.trim().toUpperCase();const shares=Number(document.getElementById('shares').value);const avgCost=Number(document.getElementById('cost').value);if(!ticker||!shares||!avgCost)return alert('Enter ticker, shares and average cost.');PORTFOLIO.add({ticker,shares,avgCost});document.getElementById('ticker').value='';document.getElementById('shares').value='';document.getElementById('cost').value='';render()}
getData().then(render);</script></body></html>
