<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eef2f5">
<title>Small Cap v3 · Investment Radar</title>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:linear-gradient(135deg,#eef2f5,#f8fafb);color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
a,button,input,select{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{max-width:1050px;margin:auto;padding:18px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}
.nav,.market,.back{border:1px solid #d9e0e6;background:rgba(255,255,255,.78);backdrop-filter:blur(18px);border-radius:14px;padding:10px 14px;font-weight:800;text-decoration:none;color:#24313d;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:center}
.markets{display:flex;gap:8px;margin-bottom:16px}.market.active{background:#17202a;color:#fff}
.hero,.detail,.card{background:rgba(255,255,255,.78);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.8);box-shadow:0 10px 30px rgba(20,30,40,.07);border-radius:22px}
.hero{padding:24px;margin-bottom:16px}.hero h1{margin:0 0 7px;font-size:clamp(28px,5vw,44px);letter-spacing:-1px}.hero p{margin:0;color:#68737e;line-height:1.5}
.stat{margin-top:14px;font-size:13px;font-weight:800;color:#707b86}.stat strong{font-size:24px;color:#17202a;margin-left:7px}
.card{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:10px;cursor:pointer}.card:hover{transform:translateY(-1px)}
.rank{font-weight:900;color:#7b8792;width:30px}.main{min-width:0;flex:1}.main h2{margin:0 0 4px;font-size:18px;overflow-wrap:anywhere}.ticker{color:#75808b;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.tags span{background:#edf1f4;border-radius:9px;padding:5px 8px;font-size:11px;font-weight:800}.price{font-weight:900}
.detail{padding:22px}.back{margin-bottom:16px}.eyebrow{font-size:12px;color:#77828d;font-weight:900;text-transform:uppercase}.detail h1{font-size:32px;margin:7px 0 2px;overflow-wrap:anywhere}.score{font-size:38px;font-weight:900;margin:10px 0 18px}.score span{font-size:13px;background:#dff5e6;color:#26733d;border-radius:10px;padding:7px 9px;vertical-align:middle}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{background:#f4f6f8;border-radius:13px;padding:12px}.metric small{display:block;color:#7a8590;font-size:11px;font-weight:700}.metric strong{display:block;margin-top:5px;font-size:16px}
.thesis{margin-top:18px;border-top:1px solid #e3e7eb;padding-top:15px;line-height:1.55}.thesis h3{margin:0 0 8px}.thesis p{color:#596570}.thesis li{margin:6px 0}.warning{background:#fff3d6;border-radius:12px;padding:11px!important;color:#785b14!important}.empty{padding:30px;text-align:center;color:#697580}
@media(max-width:650px){html,body{overflow-x:hidden}.app{padding:12px max(12px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}.top{align-items:stretch}.markets{display:grid;grid-template-columns:1fr 1fr}.hero{padding:18px}.hero h1{font-size:28px;line-height:1.08}.card{padding:13px;gap:9px}.grid{grid-template-columns:1fr 1fr}.price{font-size:13px}.detail{padding:17px}.detail h1{font-size:27px}.card .main{min-width:0}.card .main p{overflow-wrap:anywhere}input,select{font-size:16px!important}}
@media(max-width:400px){.grid{grid-template-columns:1fr}.top{display:grid;grid-template-columns:1fr 1fr}.top .nav{font-size:12px;padding:8px}.rank{width:22px}.card{align-items:flex-start}.markets{gap:7px}}
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <a class="nav" href="index.html">← Investment Radar</a>
    <a class="nav" href="custom.html">⭐ My Stocks</a>
  </div>
  <div class="markets">
    <button class="market active" data-market="Canada" onclick="setMarket('Canada')">🇨🇦 Canada</button>
    <button class="market" data-market="India" onclick="setMarket('India')">🇮🇳 India</button>
  </div>
  <section class="hero">
    <h1 id="title">Small Cap v3 / Sky Rocket Radar</h1>
    <p id="subtitle">Loading...</p>
    <div class="stat">SELECTED <strong id="count">0</strong> / 10</div>
    <div id="freshness" class="stat">Data status: loading…</div>
  </section>
  <div id="cards"></div>
  <div id="detail" style="display:none"></div>
</main>
<script src="engine/smallcap.js?v=1.0.2"></script>
</body>
</html>
